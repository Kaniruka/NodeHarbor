name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build WebUI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Download pinned Mihomo validator
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo.zip'
          Invoke-WebRequest 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-windows-amd64-v1.19.30.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          $expected = '22C09FD67673895EF7CD6B1820563918275C3D316F2462B306208675118DB3C0'
          if ($actual -ne $expected) { throw "Mihomo checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'mihomo')

      - name: Test and build backend
        shell: pwsh
        run: |
          $env:NODEHARBOR_TEST_MIHOMO = Join-Path $env:RUNNER_TEMP 'mihomo/mihomo-windows-amd64.exe'
          if (-not (Test-Path -LiteralPath $env:NODEHARBOR_TEST_MIHOMO -PathType Leaf)) { throw "Pinned Mihomo test binary is missing: $env:NODEHARBOR_TEST_MIHOMO" }
          go test ./...
          go vet ./...
          go build ./cmd/nodeharbor

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -Version $env:GITHUB_SHA
          $package = Join-Path $env:RUNNER_TEMP 'nodeharbor-package'
          Expand-Archive -LiteralPath "dist\NodeHarbor-windows-$env:GITHUB_SHA.zip" -DestinationPath $package
          .\scripts\smoke-windows.ps1 -PackageDirectory $package

  kernelsu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download pinned arm64 Mihomo core
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mihomo-android-arm64-v8-v1.19.30.gz"
          core="$RUNNER_TEMP/nodeharbor-core"
          curl --fail --location --silent --show-error \
            'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-android-arm64-v8-v1.19.30.gz' \
            --output "$archive"
          echo '19AFEB40FCA190FC2E3906A4E3B87C74A0C2120626FD3CB3AE0CF4092CB780AD  '"$archive" | sha256sum --check
          gzip --decompress --stdout "$archive" > "$core"
          chmod 755 "$core"
      - name: Build and smoke-test KernelSU package contract
        shell: pwsh
        run: |
          ./scripts/package-kernelsu.ps1 -MihomoPath "$env:RUNNER_TEMP/nodeharbor-core" -Version 0.2.0
          $package = Join-Path $env:RUNNER_TEMP 'nodeharbor-kernelsu-package'
          Expand-Archive -LiteralPath 'dist/NodeHarbor-kernelsu-0.2.0.zip' -DestinationPath $package
          ./scripts/smoke-kernelsu.ps1 -PackageDirectory $package
